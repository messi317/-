
</body><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Panic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translateZ(0);
            will-change: transform;
        }
        #ruffle-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
    <script src="ruffle/ruffle.js"></script>
    <script src="capacitor.js"></script>
</head>
<body>
    <div id="ruffle-container"></div>

    <script>
        // إجبار الشاشة على الوضع الأفقي
        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
        }

        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "autoplay": "on",
            "unmuteOverlay": "hidden",
            "letterbox": "on",
            "openUrlMode": "confirm",
            "playerVersion": 32,
            "preferredRenderer": "webgl",
            "quality": "high"
        };

        const SAVE_FILE_NAME = 'battlepanic_save.json';
        let isSaving = false;

        // 1. استرجاع بيانات الحفظ من مجلد Data عند تشغيل التطبيق
        async function restoreFromDataFolder() {
            try {
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
                    const Filesystem = window.Capacitor.Plugins.Filesystem;
                    const result = await Filesystem.readFile({
                        path: SAVE_FILE_NAME,
                        directory: Filesystem.Directory ? Filesystem.Directory.Data : 'DATA',
                        encoding: 'utf8'
                    });

                    if (result.data) {
                        const savedData = JSON.parse(result.data);
                        for (const key in savedData) {
                            localStorage.setItem(key, savedData[key]);
                        }
                        console.log("Save loaded from Data directory successfully.");
                    }
                }
            } catch (e) {
                console.log("No previous save file found in Data folder.");
            }
        }

        // 2. كتابة البيانات داخل مجلد Data
        async function saveToDataFolder() {
            if (isSaving) return;
            isSaving = true;

            try {
                const currentSave = {};
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key) {
                        currentSave[key] = localStorage.getItem(key);
                    }
                }

                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
                    const Filesystem = window.Capacitor.Plugins.Filesystem;
                    await Filesystem.writeFile({
                        path: SAVE_FILE_NAME,
                        data: JSON.stringify(currentSave),
                        directory: Filesystem.Directory ? Filesystem.Directory.Data : 'DATA',
                        encoding: 'utf8'
                    });
                    console.log("Saved to Data directory.");
                }
            } catch (e) {
                console.error("Error writing to Data directory:", e);
            } finally {
                isSaving = false;
            }
        }

        // 3. تشغيل محاكي Ruffle وإعداد المراقبة
        window.addEventListener("load", async () => {
            // تحميل البيانات المحفوظة سابقاً من مجلد Data أولاً
            await restoreFromDataFolder();

            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            container.appendChild(player);

            player.load({
                url: "battlepanic.swf",
                scale: "showAll",
                forceScale: true,
                allowScriptAccess: true
            });

            // مراقبة الحفظ التلقائي بشكل مستمر
            startAutoSaveLoop();
        });

        // 4. دالة الحفظ الدائم والتلقائي
        function startAutoSaveLoop() {
            // حفظ كل 3 ثواني
            setInterval(() => {
                saveToDataFolder();
            }, 3000);

            // حفظ فوراً عند إغلاق التطبيق أو الانتقال لتطبيق آخر
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') {
                    saveToDataFolder();
                }
            });

            window.addEventListener('beforeunload', () => {
                saveToDataFolder();
            });
        }
    </script>
</body>
</html>

</html>
