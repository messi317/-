<!-- زر دائري للحفظ يظهر على الموبايل -->
<button id="saveBtn" style="
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: #28a745;
  color: #fff;
  border: none;
  font-size: 24px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  z-index: 9999;
">💾</button>

<script>
  // دالة الحفظ
  async function saveProgress(level) {
    const lvl = parseInt(level) || window.currentLevel || 1;
    try {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Storage) {
        await window.Capacitor.Plugins.Storage.set({ key: 'battlepanic_level', value: String(lvl) });
      } else {
        localStorage.setItem('battlepanic_level', String(lvl));
      }
      showToast("تم حفظ المرحلة " + lvl);
      console.log("Saved level", lvl);
    } catch (e) {
      console.error("Save error", e);
      showToast("فشل الحفظ");
    }
  }

  // ربط الزر بالحدث
  document.getElementById("saveBtn").addEventListener("click", () => {
    saveProgress(window.currentLevel);
  });

  // دالة عرض رسالة قصيرة (Toast)
  function showToast(msg) {
    const el = document.createElement("div");
    el.textContent = msg;
    el.style.position = "fixed";
    el.style.bottom = "90px";
    el.style.right = "20px";
    el.style.background = "rgba(0,0,0,0.85)";
    el.style.color = "#fff";
    el.style.padding = "10px 14px";
    el.style.borderRadius = "8px";
    el.style.zIndex = 10000;
    el.style.fontSize = "16px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }

  // استرجاع التقدّم عند بداية اللعبة
  (async () => {
    const saved = localStorage.getItem("battlepanic_level");
    if (saved) {
      window.currentLevel = parseInt(saved);
      console.log("Restored level", window.currentLevel);
    } else {
      window.currentLevel = 1;
    }
  })();
</script>
