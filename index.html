<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Panic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            /* تسريع رسومي كامل لإزالة التقطيع */
            transform: translateZ(0);
            will-change: transform;
        }
        #ruffle-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
    <script src="ruffle/ruffle.js"></script>
    <script src="capacitor.js"></script>
</head>
<body>
    <div id="ruffle-container"></div>

    <script>
        // إعدادات Ruffle الأصلية مع تفعيل WebGL للأداء العالي
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "autoplay": "on",
            "unmuteOverlay": "hidden",
            "letterbox": "on",
            "openUrlMode": "confirm",
            "playerVersion": 32,
            "preferredRenderer": "webgl",
            "quality": "high"
        };

        let player;

        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            container.appendChild(player);

            player.load({
                url: "battlepanic.swf",
                scale: "showAll",
                forceScale: true,
                allowScriptAccess: true
            });

            // استعادة وتزامن الحفظ مع مجلد Android/data
            restoreDataSave();
            startAutoSaveToData();
        });

        const SAVE_FILE_NAME = 'battlepanic_save.json';

        // استرجاع الحفظ من مجلد Data عند تشغيل اللعبة
        async function restoreDataSave() {
            try {
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
                    const Filesystem = window.Capacitor.Plugins.Filesystem;
                    const result = await Filesystem.readFile({
                        path: SAVE_FILE_NAME,
                        directory: Filesystem.Directory ? Filesystem.Directory.Data : 'DATA',
                        encoding: 'utf8'
                    });

                    if (result.data) {
                        const savedData = JSON.parse(result.data);
                        for (const key in savedData) {
                            localStorage.setItem(key, savedData[key]);
                        }
                    }
                }
            } catch (e) {
                console.log("No existing save file in Data directory yet.");
            }
        }

        // حفظ التقدم تلقائياً في مجلد Android/data فور إكمال المرحلة
        function startAutoSaveToData() {
            setInterval(async () => {
                try {
                    const currentSave = {};
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        currentSave[key] = localStorage.getItem(key);
                    }

                    if (Object.keys(currentSave).length > 0 && window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
                        const Filesystem = window.Capacitor.Plugins.Filesystem;
                        await Filesystem.writeFile({
                            path: SAVE_FILE_NAME,
                            data: JSON.stringify(currentSave),
                            directory: Filesystem.Directory ? Filesystem.Directory.Data : 'DATA',
                            encoding: 'utf8'
                        });
                    }
                } catch (e) {
                    console.error("Auto save to Data error:", e);
                }
            }, 3000);
        }
    </script>
</body>
</html>
