<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, maximum-scale=1.0, user-scalable=no">
  <title>Battle Panic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden; background-color: #000;
      display: flex; justify-content: center; align-items: center;
    }
    #ruffle-container {
      width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    ruffle-player {
      width: 100% !important; height: 100% !important;
    }
  </style>
  <script src="ruffle/ruffle.js"></script>
</head>
<body>
  <div id="ruffle-container"></div>

  <script>
    // إعداد Ruffle
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      letterbox: "on"
    };

    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      document.getElementById("ruffle-container").appendChild(player);
      player.load({ url: "battlepanic.swf", scale: "showAll", forceScale: true });
    });

    // نظام الحفظ والخروج
    let currentLevel = 1;

    function finishLevel() {
      // حفظ المرحلة
      localStorage.setItem("battlepanic_level", currentLevel);
      alert("تم حفظ المرحلة " + currentLevel);

      // زيادة المرحلة
      currentLevel++;

      // الخروج من اللعبة (إعادة توجيه لصفحة رئيسية أو إغلاق)
      window.location.href = "menu.html"; 
    }

    // استرجاع التقدّم عند بداية اللعبة
    const savedLevel = localStorage.getItem("battlepanic_level");
    if (savedLevel) {
      currentLevel = parseInt(savedLevel);
      console.log("تم استرجاع المرحلة:", currentLevel);
    }
  </script>
</body>
</html>
