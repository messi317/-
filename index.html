<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Panic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translateZ(0);
            will-change: transform;
        }
        #ruffle-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }
        /* شريط أزرار التحكم العلوي */
        .save-bar {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 99999;
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .save-btn {
            background: #222;
            color: #fff;
            border: 1px solid #666;
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .save-btn:active {
            background: #444;
        }
    </style>
    <script src="ruffle/ruffle.js"></script>
    <script src="capacitor.js"></script>
</head>
<body>

    <!-- أزرار الحفظ والاسترجاع المباشرة لمجلد Data -->
    <div class="save-bar">
        <button class="save-btn" onclick="saveSaveFileToData()">حفظ في Data 📥</button>
        <button class="save-btn" onclick="loadSaveFileFromData()">استرجاع من Data 🔄</button>
    </div>

    <div id="ruffle-container"></div>

    <script>
        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
        }

        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "autoplay": "on",
            "unmuteOverlay": "hidden",
            "letterbox": "on",
            "openUrlMode": "confirm",
            "playerVersion": 32,
            "preferredRenderer": "webgl",
            "quality": "high"
        };

        const SAVE_FILE_NAME = 'battlepanic_save.json';

        window.addEventListener("load", async () => {
            // استرجاع ملف الحفظ تلقائياً من مجلد Data عند التشغيل
            await loadSaveFileFromData(true);

            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            container.appendChild(player);

            player.load({
                url: "battlepanic.swf",
                scale: "showAll",
                forceScale: true,
                allowScriptAccess: true
            });
        });

        // 1. عند الضغط على "حفظ في Data": يتم أخذ نسخة من تقدم اللعبة وكتابته بملف داخل مجلد Data
        async function saveSaveFileToData() {
            try {
                const currentSave = {};
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key) {
                        currentSave[key] = localStorage.getItem(key);
                    }
                }

                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
                    const Filesystem = window.Capacitor.Plugins.Filesystem;
                    await Filesystem.writeFile({
                        path: SAVE_FILE_NAME,
                        data: JSON.stringify(currentSave),
                        directory: Filesystem.Directory ? Filesystem.Directory.Data : 'DATA',
                        encoding: 'utf8'
                    });
                    alert("تم تنزيل وحفظ ملف التقدم داخل مجلد Data بنجاح! 📥");
                } else {
                    alert("تم الحفظ في ذاكرة التطبيق المحلية! 💾");
                }
            } catch (e) {
                console.error("خطأ أثناء الحفظ:", e);
                alert("حدث خطأ أثناء تنزيل ملف الحفظ!");
            }
        }

        // 2. قراءة ملف الحفظ من مجلد Data واسترجاعه
        async function loadSaveFileFromData(silent = false) {
            try {
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
                    const Filesystem = window.Capacitor.Plugins.Filesystem;
                    const result = await Filesystem.readFile({
                        path: SAVE_FILE_NAME,
                        directory: Filesystem.Directory ? Filesystem.Directory.Data : 'DATA',
                        encoding: 'utf8'
                    });

                    if (result.data) {
                        const savedData = JSON.parse(result.data);
                        for (const key in savedData) {
                            localStorage.setItem(key, savedData[key]);
                        }
                        if (!silent) alert("تم استرجاع التقدم من مجلد Data بنجاح! 🔄");
                    }
                }
            } catch (e) {
                if (!silent) alert("لم يتم العثور على ملف حفظ سابق في مجلد Data!");
            }
        }
    </script>
</body>
</html>
